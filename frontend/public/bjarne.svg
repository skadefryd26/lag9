      <stop offset="0.6" stop-color="#eeb694"/>
      <stop offset="1" stop-color="#c98a68"/>
    </radialGradient>
    <radialGradient id="kinn" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#e98a7a" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#e98a7a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="stubb" cx="50%" cy="30%" r="70%">
