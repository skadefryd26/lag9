  <path d="M244 420 Q236 398 256 394 L290 396 Q300 404 292 420 Q270 432 244 420 Z" fill="#e5a988" stroke="#b77c5f" stroke-width="2.5"/>
  <path d="M258 402 q14 2 28 0 M256 412 q14 2 30 0" stroke="#b77c5f" stroke-width="1.8" fill="none"/>

  <!-- Snakkeboble -->
  <g transform="translate(10 14)">
    <path d="M0 0 H124 Q136 0 136 12 V50 Q136 62 124 62 H44 L26 82 L30 62 H12 Q0 62 0 50 V12 Q0 0 12 0 Z" fill="#fff" stroke="#3a2314" stroke-width="3"/>
    <text x="68" y="29" font-family="Georgia, serif" font-size="18" font-weight="700" text-anchor="middle" fill="#3a2314">*sukk*</text>
    <text x="68" y="50" font-family="Georgia, serif" font-size="12" font-style="italic" text-anchor="middle" fill="#3a2314">kl. 15:55…</text>
