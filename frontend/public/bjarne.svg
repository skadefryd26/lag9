    <ellipse cx="30" cy="0" rx="12" ry="2.5" fill="#8a5a36" opacity="0.7"/>
    <path d="M72 18 Q100 22 94 46 Q90 64 64 60" fill="none" stroke="#5a4636" stroke-width="7"/>
