  <g transform="translate(268 344) rotate(-7)">
    <path d="M18 -12 q-8 -12 0 -24 q8 -12 0 -24" stroke="#c5ad99" stroke-width="4" fill="none" stroke-linecap="round" filter="url(#myk)" opacity="0.85"/>
    <path d="M38 -12 q-8 -12 0 -24 q8 -12 0 -24" stroke="#c5ad99" stroke-width="4" fill="none" stroke-linecap="round" filter="url(#myk)" opacity="0.85"/>
